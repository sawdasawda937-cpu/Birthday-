<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Priya</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle,#51227d,#10051f 75%);font-family:Arial,sans-serif;color:white}
.title{position:fixed;top:4%;width:100%;text-align:center;font-size:clamp(26px,7vw,58px);text-shadow:0 0 15px #fff,0 0 30px #d57aff;z-index:2}
.word{position:absolute;top:-15vh;left:var(--x);font-size:clamp(18px,5vw,36px);font-weight:bold;white-space:nowrap;text-shadow:0 0 12px #fff,0 0 24px #c66cff;animation:drop var(--t) linear infinite;animation-delay:var(--d)}
@keyframes drop{0%{transform:translateY(-15vh);opacity:0}10%{opacity:1}100%{transform:translateY(130vh);opacity:1}}
</style>
</head>
<body>
<div class="title">🎂 Happy Birthday Priya 🎉</div>
<div class="word" style="--x:2%;--t:5.5s;--d:0s">Happy Birthday Priya ❤️</div>
<div class="word" style="--x:35%;--t:6s;--d:.5s">Happy Birthday Priya 🎉</div>
<div class="word" style="--x:62%;--t:5.7s;--d:1s">Happy Birthday Priya 💖</div>
<div class="word" style="--x:15%;--t:6.3s;--d:1.5s">Happy Birthday Priya ✨</div>
<div class="word" style="--x:45%;--t:5.8s;--d:2s">Happy Birthday Priya 🎂</div>
<div class="word" style="--x:70%;--t:6.5s;--d:2.5s">Happy Birthday Priya 🥳</div>
<div class="word" style="--x:5%;--t:6.1s;--d:3s">Happy Birthday Priya 🎁</div>
<div class="word" style="--x:38%;--t:5.6s;--d:3.5s">Happy Birthday Priya 🌸</div>
<div class="word" style="--x:66%;--t:6.2s;--d:4s">Happy Birthday Priya 💕</div>
</body>
</html>
